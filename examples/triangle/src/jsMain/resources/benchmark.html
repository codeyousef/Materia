<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triangle Benchmark</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        #materia-canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
<canvas id="materia-canvas" width="1920" height="1080"></canvas>
<script>
    const benchmarkParams = Object.fromEntries(new URLSearchParams(window.location.search).entries());
    const reportUrl = benchmarkParams.reportUrl || "/__benchmark_report__";

    function reportBenchmarkPageError(message) {
        fetch(reportUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                scene: "Triangle",
                error: message
            })
        }).catch(() => {});
    }

    window.__materiaBenchmarkParams = benchmarkParams;
    window.addEventListener("error", (event) => {
        reportBenchmarkPageError(`page error: ${event.message || "Unknown error"}`);
    });
    window.addEventListener("unhandledrejection", (event) => {
        const reason = event.reason && event.reason.message ? event.reason.message : String(event.reason);
        reportBenchmarkPageError(`unhandled rejection: ${reason}`);
    });
</script>
<script src="triangle.js"></script>
</body>
</html>
