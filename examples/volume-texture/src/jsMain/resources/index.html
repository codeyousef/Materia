<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Materia Volume Texture</title>
    <style>
        html, body {
            margin: 0;
            min-height: 100%;
            background:
                radial-gradient(circle at top, rgba(40, 92, 99, 0.35), transparent 45%),
                linear-gradient(180deg, #07131a 0%, #031018 100%);
            color: #e5f4f7;
            font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
        }

        #app-root {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        #volume-texture-canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .volume-overlay {
            position: absolute;
            left: 20px;
            top: 20px;
            margin: 0;
            padding: 14px 16px;
            max-width: min(340px, calc(100vw - 40px));
            border: 1px solid rgba(170, 223, 231, 0.18);
            border-radius: 14px;
            background: rgba(3, 16, 24, 0.72);
            box-shadow: 0 16px 50px rgba(0, 0, 0, 0.28);
            backdrop-filter: blur(12px);
            white-space: pre-wrap;
            line-height: 1.45;
            font-family: "IBM Plex Mono", "SFMono-Regular", monospace;
            font-size: 13px;
        }
    </style>
</head>
<body>
<div id="app-root"></div>
<script src="volume-texture.js"></script>
</body>
</html>
